name: webrtc_coordinator
description: A peer-to-peer transport for peer_coordinator using WebRTC with data streams.
version: 0.2.0
homepage: https://zeyus.com/
repository: https://github.com/NexusDynamic/liblsl.dart
issue_tracker: https://github.com/NexusDynamic/liblsl.dart/issues

resolution: workspace

environment:
  sdk: ^3.12.2

dependencies:
  meta: ^1.15.0
  logging: ^1.3.0
  collection: ^1.19.1
  fast_immutable_collections: ^11.2.0
  peer_coordinator: ^0.3.1
  # Regular dep, not dev: lib/testing.dart ships the fake adapter and the
  # participation harness for webrtc_coordinator_flutter to reuse, exactly as
  # peer_coordinator ships its conformance suite.
  test: ^1.31.2

dev_dependencies:
  lints: ^6.0.0
