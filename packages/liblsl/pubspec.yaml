name: liblsl
description: A Dart (and Flutter) native library for working with Lab Streaming
  Layer (LSL / liblsl).
version: 0.14.0+0
homepage: https://zeyus.com/
repository: https://github.com/NexusDynamic/liblsl.dart
issue_tracker: https://github.com/NexusDynamic/liblsl.dart/issues

resolution: workspace

environment:
  sdk: ^3.11.0

dependencies:
  ffi: ^2.1.5
  hooks: ^2.1.0
  native_toolchain_c: ^0.19.3
  code_assets: ^1.0.0
  logging: ^1.3.0
  meta:
  fast_immutable_collections: ^11.1.0
  android_libcpp_shared: ^0.2.0

dev_dependencies:
  ffigen: ^21.0.0
  lints: ^6.1.0
  test: ^1.31.0
  dartdoc: ^9.0.8

ffigen:
  name: Liblsl
  silence-enum-warning: true
  ffi-native:
  description: Bindings to `lsl_c.h`.
  output: "lib/native_liblsl.dart"
  headers:
    entry-points:
      - "src/liblsl-9f0b6122/include/lsl_c.h"
    include-directives:
      - "src/liblsl-9f0b6122/include/lsl/*.h"
      - "src/liblsl-9f0b6122/include/lsl_c.h"
  compiler-opts:
    - "-Isrc/liblsl-9f0b6122/include"
  structs:
    dependency-only: opaque
  functions:
    expose-typedefs:
      include:
        - ".*"
