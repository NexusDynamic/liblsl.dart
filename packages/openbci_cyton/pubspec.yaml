name: openbci_cyton
description: >-
  The OpenBCI Cyton (and Cyton + Daisy) biosensing board over its USB
  dongle, in pure Dart: commands, channel settings, samples in µV, markers,
  impedance, and SD card recordings (also as XDF).
version: 0.2.0
homepage: https://zeyus.com/
repository: https://github.com/NexusDynamic/liblsl.dart
issue_tracker: https://github.com/NexusDynamic/liblsl.dart/issues

resolution: workspace

environment:
  sdk: ^3.10.0

dependencies:
  serial_transport: ^0.1.0
  xdf: ^0.2.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.28.0
