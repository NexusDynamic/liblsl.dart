name: liblsl_coordinator
description: A performance-focused Dart (and Flutter) LSL-based device coordination library.
version: 0.4.1
homepage: https://zeyus.com/
repository: https://github.com/NexusDynamic/liblsl.dart
issue_tracker: https://github.com/NexusDynamic/liblsl.dart/issues

resolution: workspace

environment:
  sdk: ^3.12.2

# Add regular dependencies here.
dependencies:
  meta: ^1.15.0
  peer_coordinator: ^0.3.1
  liblsl: ^1.0.0
  # Direct, not transitive: the inlet worker allocates an out-parameter for
  # lsl_open_stream when it opens inlets on a helper isolate.
  ffi: ^2.2.0
  synchronized: ^3.4.0+1
  logging: ^1.3.0
  uuid: ^4.5.3
  collection: ^1.19.1
  fast_immutable_collections: ^11.2.0
  # path: ^1.8.0

dev_dependencies:
  integration_test:
    sdk: flutter
  lints: ^6.0.0
  test: ^1.31.2
