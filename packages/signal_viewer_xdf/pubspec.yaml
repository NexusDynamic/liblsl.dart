name: signal_viewer_xdf
description: >-
  XDF recordings for signal_viewer: open .xdf files (LabRecorder) of any
  size, on all platforms including the web.
version: 0.1.0
homepage: https://zeyus.com/
repository: https://github.com/NexusDynamic/liblsl.dart
issue_tracker: https://github.com/NexusDynamic/liblsl.dart/issues
publish_to: 'none'

resolution: workspace

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  signal_viewer: ^0.1.0
  xdf: ^0.1.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
