name: signal_viewer
description: >-
  A Flutter viewer for multichannel signals from any source (recordings,
  live devices, network streams), with pluggable source providers.
version: 0.1.0
homepage: https://zeyus.com/
repository: https://github.com/NexusDynamic/liblsl.dart
issue_tracker: https://github.com/NexusDynamic/liblsl.dart/issues
publish_to: 'none'

resolution: workspace

environment:
  sdk: ^3.10.0

dependencies:
  desktop_drop: ^0.8.4
  easy_shared_preferences: ^1.1.2
  fftea: ^1.5.0+1
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  package_info_plus: ^10.2.1
  path_provider: ^2.1.6
  signal_core: ^0.1.0
  web: ^1.1.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
