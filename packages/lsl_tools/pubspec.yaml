name: lsl_tools
description: >-
  Lab Streaming Layer tools in pure Dart: a web-safe facade over liblsl,
  recording to XDF, a WebSocket bridge between networks, test outlets, and
  the `lsl` command line tool.
version: 0.2.1
homepage: https://zeyus.com/
repository: https://github.com/NexusDynamic/liblsl.dart
issue_tracker: https://github.com/NexusDynamic/liblsl.dart/issues

resolution: workspace

environment:
  sdk: ^3.12.2

dependencies:
  args: ^2.6.0
  liblsl: ^1.1.2
  openbci_cyton: ^0.1.0
  peer_coordinator: ^0.4.0
  serial_transport: ^0.1.0
  signal_core: ^0.1.0
  web_socket_channel: ^3.0.3
  xdf: ^0.1.0
  xml: ^7.1.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.28.0
  webrtc_coordinator: ^0.2.1

executables:
  lsl:
