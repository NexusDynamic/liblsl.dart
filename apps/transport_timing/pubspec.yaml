name: transport_timing
description: >-
  A Flutter app that measures latency, jitter, loss and clock drift between
  devices over LSL, WebSocket and WebRTC.
publish_to: "none"
homepage: https://zeyus.com/
repository: https://github.com/NexusDynamic/liblsl.dart
issue_tracker: https://github.com/NexusDynamic/liblsl.dart/issues

resolution: workspace

version: 2.0.0+1

environment:
  sdk: ^3.12.2
  flutter: ">=3.27.1"

dependencies:
  flutter:
    sdk: flutter
  liblsl: ^1.1.0
  liblsl_coordinator: ^0.5.0
  peer_coordinator: ^0.4.0
  webrtc_coordinator: ^0.2.0
  webrtc_coordinator_flutter: ^0.2.1
  timing_core: ^0.1.0
  flutter_multicast_lock: ^1.1.0
  path_provider: ^2.1.5
  shared_preferences: ^2.5.5
  flutter_fullscreen: ^1.2.0
  wakelock_plus: ^1.6.0
  share_plus: ^13.1.0
  permission_handler: ^13.0.0
  flutter_refresh_rate_control: ^0.0.6+0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
