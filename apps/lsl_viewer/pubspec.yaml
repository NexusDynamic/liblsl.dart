name: lsl_viewer
description: "Lab Streaming Layer stream and XDF recording viewer"
publish_to: 'none'
version: 0.3.8+0

resolution: workspace

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  nexus_branding: ^0.1.0
  serial_transport: ^0.1.0
  signal_viewer: ^0.2.3
  signal_viewer_lsl: ^0.3.6
  signal_viewer_serial: ^0.2.3
  signal_viewer_xdf: ^0.2.3
  # USB serial devices on Android.
  usb_serial: ^0.6.0

dev_dependencies:
  launcher_icons: ^0.16.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  shared_preferences: ^2.5.5

  material_ui: any
flutter:
  uses-material-design: true
