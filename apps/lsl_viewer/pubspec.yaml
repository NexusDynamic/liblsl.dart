name: lsl_viewer
description: "Lab Streaming Layer stream and XDF recording viewer"
publish_to: 'none'
version: 0.2.0+0

resolution: workspace

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  serial_transport: ^0.1.0
  signal_viewer: ^0.1.0
  signal_viewer_lsl: ^0.2.0
  signal_viewer_serial: ^0.1.0
  signal_viewer_xdf: ^0.1.0
  # USB serial devices on Android (a patched copy, see the workspace's
  # third_party/usb_serial).
  usb_serial: ^0.5.2

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  shared_preferences: ^2.5.5

flutter:
  uses-material-design: true
