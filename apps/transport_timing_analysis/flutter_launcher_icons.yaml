# The launcher icons are the NexusDynamic icon, shared by the applications
# in this repository (packages/nexus_branding/assets/icon). To regenerate
# them after those images change:
#   dart run flutter_launcher_icons
# Linux has no generator: linux/runner/my_application.cc loads
# data/icon.png from the bundle, which linux/CMakeLists.txt copies from the
# same folder.
flutter_launcher_icons:
  image_path: "../../packages/nexus_branding/assets/icon/icon.png"

  android: true
  min_sdk_android: 21
  adaptive_icon_background: "#0A0A0A"
  adaptive_icon_foreground: "../../packages/nexus_branding/assets/icon/foreground.png"

  ios: true
  image_path_ios: "../../packages/nexus_branding/assets/icon/icon_square.png"
  remove_alpha_ios: true

  web:
    generate: true
    image_path: "../../packages/nexus_branding/assets/icon/icon.png"
    background_color: "#09090B"
    theme_color: "#3C0366"

  windows:
    generate: true
    image_path: "../../packages/nexus_branding/assets/icon/icon.png"
    icon_size: 256

  macos:
    generate: true
    image_path: "../../packages/nexus_branding/assets/icon/icon.png"
