name: liblsl_metapackage
publish_to: none
homepage: https://zeyus.com/
repository: https://github.com/NexusDynamic/liblsl.dart
environment:
  sdk: ^3.12.2
  flutter: ^3.27.1
workspace:
  - packages/liblsl
  - packages/peer_coordinator
  - packages/peer_coordinator/example
  - packages/liblsl_test
  - packages/liblsl_coordinator
  - packages/webrtc_coordinator
  - packages/webrtc_coordinator_flutter
  - packages/liblsl_timing
  - packages/liblsl_analysis
dev_dependencies:
  melos: ^8.2.2

# for now, this is required
# native_toolchain_c requires a higher
# meta version, melos requires a higher cli_util
# and test_api is incompatible between the two versions of test and flutter_test.
dependency_overrides:
  cli_util: ^0.5.2
  test_api: ^0.7.13
#   meta: ^1.19.0

melos:
  packages:
    - packages/**
  command:
    version:
      # Only allow versioning to happen on main branch.
      branch: main
      # # Generates a link to a prefilled GitHub release creation page.
      # releaseUrl: true
      # includeCommitId: true
      # linkToCommits: true
    bootstrap:
      environment:
        sdk: ^3.9.0
        flutter: ^3.27.1
        test: any
  scripts:
    lint:all:
      steps:
        - analyze
        - format
      description: Run all static analysis checks.
    analyze:
      exec: dart analyze .
      description: Run `dart analyze` for all packages.
    format:
      exec: dart format .
      description: Run `dart format` for all packages.
    format-check:
      exec: dart format . --set-exit-if-changed
      description: Run `dart format` checks for all packages.
    test:select:
      exec: flutter test --exclude-tags "performance,benchmark,lsl"
      packageFilters:
        dirExists: test
        flutter: true
        ignore:
          # for now, this doesn't pass in the Dart VM
          # the app works when built in release mode
          - liblsl_test
      description: Run `flutter test` for selected Flutter packages.
    test:dart:
      exec: dart test --exclude-tags "performance,benchmark,lsl"
      packageFilters:
        dirExists: test
        flutter: false
      description: >-
        Run `dart test` for pure-Dart packages. `lsl` is excluded because those
        tests need a real LSL network stack on loopback; run `test:lsl` for those.
    test:lsl:
      # --concurrency=1 serialises test *files* within the package; the melos
      # `concurrency: 1` below serialises across packages. Both are needed:
      # these tests bind real sockets and resolve peers machine-wide, so any
      # two running at once interfere.
      # `|| true`: packages with no lsl-tagged tests exit non-zero with
      # "No tests match the requested tag selectors", which is not a failure.
      exec: dart test --tags "lsl" --concurrency=1 || true
      concurrency: 1
      packageFilters:
        dirExists: test
        flutter: false
      description: >-
        Run LSL-backed integration tests serially. These bind loopback sockets and
        are timing-sensitive, so they must not run concurrently with each other.
    test:performance:
      exec: flutter test --concurrency=1 --tags "performance"
      concurrency: 1
      packageFilters:
        dirExists: test
        ignore:
          - liblsl_test
      description: Run performance tests for selected packages (without concurrency).
    test:
      steps:
        - test:select
        - test:dart
      description: Run all non-LSL tests in this project.
    upgrade: melos exec flutter pub upgrade
    coverage:
      steps:
        - melos exec -- flutter test --coverage
        - melos exec -- genhtml coverage/lcov.info --output-directory=coverage/
      packageFilters:
        dirExists: test
      description: Generate coverage for the selected package.
