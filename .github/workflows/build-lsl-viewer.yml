name: Build lsl_viewer

# Builds apps/lsl_viewer for every target we distribute (iOS is not built: it
# is not published to the App Store). Called by release.yml for lsl_viewer-v*
# tags; can also be run by hand to try the builds without releasing.
# Each target is uploaded as a workflow artifact named lsl_viewer-<target>;
# the unzipped web build is also uploaded as site-lsl_viewer.

on:
  workflow_call:
    inputs:
      version:
        description: "Version string used in the artifact file names"
        required: true
        type: string
      base-href:
        description: "Base href for the web build"
        required: false
        type: string
        default: "/"
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
  workflow_dispatch:
    inputs:
      version:
        description: "Version string used in the artifact file names"
        required: false
        type: string
        default: "dev"
      base-href:
        description: "Base href for the web build"
        required: false
        type: string
        default: "/"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            os: ubuntu-latest
          - target: windows
            os: windows-latest
          - target: macos
            os: macos-latest
          - target: android
            os: ubuntu-latest
          - target: web
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ inputs.version }}
      NAME: lsl_viewer-${{ inputs.version }}-${{ matrix.target }}

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Linux build dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libudev-dev

      - name: Setup Java
        if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-main"
          pub-cache-key: "flutter-pub-:os:-:channel:-:version:-:arch:-main"

      - name: Get dependencies
        working-directory: apps/lsl_viewer
        run: flutter pub get

      - name: Write Android signing config
        if: matrix.target == 'android'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: apps/lsl_viewer/android
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: the APKs are signed with the debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          {
            echo "storeFile=release.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > key.properties

      - name: Build
        working-directory: apps/lsl_viewer
        run: |
          case "${{ matrix.target }}" in
            android) flutter build apk --release --split-per-abi ;;
            web)     flutter build web --release --base-href "${{ inputs.base-href }}" ;;
            *)       flutter build "${{ matrix.target }}" --release ;;
          esac

      - name: Package
        working-directory: apps/lsl_viewer/build
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          DIST="$GITHUB_WORKSPACE/dist"
          case "${{ matrix.target }}" in
            linux)
              tar -C linux/x64/release/bundle -czf "$DIST/$NAME-x64.tar.gz" .
              ;;
            windows)
              (cd windows/x64/runner/Release && 7z a -tzip "$DIST/$NAME-x64.zip" .)
              ;;
            macos)
              # Unsigned: users need to right-click → Open the first time.
              APP="$(find macos/Build/Products/Release -maxdepth 1 -name '*.app' | head -n1)"
              ditto -c -k --keepParent "$APP" "$DIST/$NAME.zip"
              ;;
            android)
              for apk in app/outputs/flutter-apk/app-*-release.apk; do
                abi="$(basename "$apk" | sed -E 's/^app-(.*)-release\.apk$/\1/')"
                cp "$apk" "$DIST/$NAME-$abi.apk"
              done
              ;;
            web)
              (cd web && zip -qr "$DIST/$NAME.zip" .)
              ;;
          esac
          ls -la "$DIST"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: lsl_viewer-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

      # The web build is also kept unzipped, for GitHub Pages.
      - name: Upload web site
        if: matrix.target == 'web'
        uses: actions/upload-artifact@v4
        with:
          name: site-lsl_viewer
          path: apps/lsl_viewer/build/web
          if-no-files-found: error
