name: Build app

# Builds one of the apps in apps/ for every target it has a platform folder
# for: Linux, Windows, macOS, Android and, where there is one, the web (iOS is
# not built: the apps are not published to the App Store). Called by
# release.yml for an app's `<app>-v*` tag; can also be run by hand to try the
# builds without releasing.
# Each target is uploaded as a workflow artifact named <app>-<target>; the
# unzipped web build is also uploaded as site-<app>. For lsl_viewer, desktop
# targets also build the `lsl` command line tool (packages/lsl_tools): it goes
# in the viewer's archive under cli/ (Linux, Windows) and in its own
# lsl-cli-<version>-<target> archive.

on:
  workflow_call:
    inputs:
      app:
        description: "The app to build: a folder of apps/"
        required: true
        type: string
      version:
        description: "Version string used in the artifact file names"
        required: true
        type: string
      base-href:
        description: "Base href for the web build"
        required: false
        type: string
        default: "/"
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
    outputs:
      has-web:
        description: "Whether the app has a web build (and a site-<app> artifact)"
        value: ${{ jobs.plan.outputs.has-web }}
  workflow_dispatch:
    inputs:
      app:
        description: "The app to build"
        required: true
        type: choice
        options:
          - lsl_viewer
          - liblsl_test
          - transport_timing
          - transport_timing_analysis
      version:
        description: "Version string used in the artifact file names"
        required: false
        type: string
        default: "dev"
      base-href:
        description: "Base href for the web build"
        required: false
        type: string
        default: "/"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # The targets: the web only for apps with a web folder.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has-web: ${{ steps.plan.outputs.has-web }}
    steps:
      - uses: actions/checkout@v6

      - name: Choose targets
        id: plan
        env:
          APP: ${{ inputs.app }}
        run: |
          [ -f "apps/$APP/pubspec.yaml" ] || { echo "::error::No app named '$APP' in apps/."; exit 1; }
          TARGETS='{"target":"linux","os":"ubuntu-latest"},{"target":"windows","os":"windows-latest"},{"target":"macos","os":"macos-latest"},{"target":"android","os":"ubuntu-latest"}'
          HAS_WEB=false
          if [ -d "apps/$APP/web" ]; then
            TARGETS="$TARGETS,{\"target\":\"web\",\"os\":\"ubuntu-latest\"}"
            HAS_WEB=true
          fi
          echo "matrix={\"include\":[$TARGETS]}" >> "$GITHUB_OUTPUT"
          echo "has-web=$HAS_WEB" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    env:
      APP: ${{ inputs.app }}
      VERSION: ${{ inputs.version }}
      NAME: ${{ inputs.app }}-${{ inputs.version }}-${{ matrix.target }}

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Linux build dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libudev-dev

      - name: Setup Java
        if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-main"
          pub-cache-key: "flutter-pub-:os:-:channel:-:version:-:arch:-main"

      - name: Get dependencies
        working-directory: apps/${{ inputs.app }}
        run: flutter pub get

      - name: Write Android signing config
        if: matrix.target == 'android'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: apps/${{ inputs.app }}/android
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: the APKs are signed with the debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          {
            echo "storeFile=release.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > key.properties

      - name: Build
        working-directory: apps/${{ inputs.app }}
        run: |
          case "${{ matrix.target }}" in
            android) flutter build apk --release --split-per-abi ;;
            web)     flutter build web --release --base-href "${{ inputs.base-href }}" ;;
            *)       flutter build "${{ matrix.target }}" --release ;;
          esac

      # A bundle: bin/lsl[.exe] and lib/ with liblsl (from its build hook).
      - name: Build lsl command line tool
        if: inputs.app == 'lsl_viewer' && contains(fromJSON('["linux", "windows", "macos"]'), matrix.target)
        working-directory: packages/lsl_tools
        run: |
          dart build cli -o build/lsl-cli
          build/lsl-cli/bundle/bin/lsl --help

      - name: Package
        working-directory: apps/${{ inputs.app }}/build
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          DIST="$GITHUB_WORKSPACE/dist"
          CLI="$GITHUB_WORKSPACE/packages/lsl_tools/build/lsl-cli/bundle"
          CLI_NAME="lsl-cli-$VERSION-${{ matrix.target }}"
          case "${{ matrix.target }}" in
            linux)
              if [ -d "$CLI" ]; then
                cp -r "$CLI" linux/x64/release/bundle/cli
                tar -C "$CLI" -czf "$DIST/$CLI_NAME-x64.tar.gz" .
              fi
              tar -C linux/x64/release/bundle -czf "$DIST/$NAME-x64.tar.gz" .
              ;;
            windows)
              if [ -d "$CLI" ]; then
                cp -r "$CLI" windows/x64/runner/Release/cli
                (cd "$CLI" && 7z a -tzip "$DIST/$CLI_NAME-x64.zip" .)
              fi
              (cd windows/x64/runner/Release && 7z a -tzip "$DIST/$NAME-x64.zip" .)
              ;;
            macos)
              # Unsigned: users need to right-click → Open the first time.
              BUNDLE="$(find macos/Build/Products/Release -maxdepth 1 -name '*.app' | head -n1)"
              ditto -c -k --keepParent "$BUNDLE" "$DIST/$NAME.zip"
              if [ -d "$CLI" ]; then
                (cd "$CLI" && zip -qr "$DIST/$CLI_NAME-$(uname -m).zip" .)
              fi
              ;;
            android)
              for apk in app/outputs/flutter-apk/app-*-release.apk; do
                abi="$(basename "$apk" | sed -E 's/^app-(.*)-release\.apk$/\1/')"
                cp "$apk" "$DIST/$NAME-$abi.apk"
              done
              ;;
            web)
              (cd web && zip -qr "$DIST/$NAME.zip" .)
              ;;
          esac
          ls -la "$DIST"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app }}-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

      # The web build is also kept unzipped, for GitHub Pages.
      - name: Upload web site
        if: matrix.target == 'web'
        uses: actions/upload-artifact@v4
        with:
          name: site-${{ inputs.app }}
          path: apps/${{ inputs.app }}/build/web
          if-no-files-found: error
