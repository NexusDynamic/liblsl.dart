name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  # Reused by release.yml: nothing is published unless this passes.
  workflow_call:
  schedule:
    # Nightly, to catch breakage from dependency or runner updates.
    - cron: '0 3 * * *'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      # socat provides the virtual serial port pairs used by the serial and
      # OpenBCI tests (they skip without it).
      - name: Install socat
        run: sudo apt-get update && sudo apt-get install -y socat

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-main"
          pub-cache-key: "flutter-pub-:os:-:channel:-:version:-:arch:-main"

      - name: Install melos
        run: dart pub global activate melos

      - name: Bootstrap packages
        run: melos bootstrap

      - name: Analyze code
        run: melos run analyze

      - name: Check formatting
        run: melos run format-check

      - name: Run tests
        run: melos run test

      # LSL-backed tests bind loopback sockets and resolve peers machine-wide,
      # so they run on their own, serially.
      - name: Run LSL tests
        run: melos run test:lsl --no-select

      # The transport-neutral core must stay compilable for the browser.
      # Catches dart:io / dart:isolate / dart:ffi creeping into the core, and
      # literals with no JavaScript representation.
      - name: Check core is web-safe
        working-directory: packages/peer_coordinator
        run: dart compile js -o /tmp/web_check.js tool/web_safety_check.dart

  # liblsl compiles the C++ library from the src/liblsl-dart_main submodule
  # through its build hook, with a different toolchain on each OS. Ubuntu is
  # covered by `test` above; this makes sure macOS (clang) and Windows (MSVC)
  # still build and run before anything is released.
  liblsl-native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-main"
          pub-cache-key: "flutter-pub-:os:-:channel:-:version:-:arch:-main"

      - name: Get dependencies
        run: flutter pub get

      # macOS defaults to 256 open files per process, which the liblsl tests
      # (sockets for every outlet, inlet and resolver in one test process)
      # run out of, and small TCP buffers slow loopback transfers. Same
      # settings as recommended for running LSL on macOS.
      - name: Tune macOS for LSL
        if: runner.os == 'macOS'
        run: |
          sudo sysctl -w net.inet.tcp.mssdflt=1420
          sudo sysctl -w net.inet.tcp.win_scale_factor=7
          sudo sysctl -w net.inet.tcp.sendspace=861275
          sudo sysctl -w net.inet.tcp.recvspace=861275
          sudo sysctl -w net.inet.tcp.autosndbufmax=8388608
          sudo sysctl -w net.inet.tcp.autorcvbufmax=8388608
          sudo sysctl -w net.inet.ip.portrange.first=32768
          sudo launchctl limit maxfiles 65536 200000

      # ulimit only applies to the step's own shell, so it is raised in the
      # steps that run tests (a no-op where the limit is already higher).
      - name: Run liblsl tests
        working-directory: packages/liblsl
        shell: bash
        run: |
          ulimit -S -n 65536 2>/dev/null || ulimit -S -n "$(ulimit -H -n)" || true
          dart test --exclude-tags "performance,benchmark,lsl"

      - name: Run liblsl LSL tests
        working-directory: packages/liblsl
        shell: bash
        run: |
          ulimit -S -n 65536 2>/dev/null || ulimit -S -n "$(ulimit -H -n)" || true
          dart test --tags "lsl" --concurrency=1
