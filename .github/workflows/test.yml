name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    # Nightly, for the LSL integration job only.
    - cron: '0 3 * * *'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-main"
          pub-cache-key: "flutter-pub-:os:-:channel:-:version:-:arch:-main"

      - name: Install melos
        run: dart pub global activate melos

      - name: Bootstrap packages
        run: melos bootstrap

      - name: Analyze code
        run: melos run analyze

      - name: Check formatting
        run: melos run format-check

      - name: Run tests
        run: melos run test

      # The transport-neutral core must stay compilable for the browser.
      # Catches dart:io / dart:isolate / dart:ffi creeping into the core, and
      # literals with no JavaScript representation.
      - name: Check core is web-safe
        working-directory: packages/peer_coordinator
        run: dart compile js -o /tmp/web_check.js tool/web_safety_check.dart

  # LSL-backed integration tests bind loopback sockets and depend on multicast
  # resolution timing, so they are kept out of the PR path. Run them on demand
  # and nightly.
  lsl-integration:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-main"
          pub-cache-key: "flutter-pub-:os:-:channel:-:version:-:arch:-main"

      - name: Install melos
        run: dart pub global activate melos

      - name: Bootstrap packages
        run: melos bootstrap

      - name: Run LSL integration tests
        run: melos run test:lsl
